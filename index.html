<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudo de violino</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f4efe8;--ink:#2a1d14;--card:#fffaf2;--line:#d9ccbb;--ac:#8a3b12;--ok:#2e7d4f;--bad:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1a1410;--ink:#f1e6d8;--card:#261c15;--line:#4a3a2c;--ac:#e0a060;--ok:#6fcf97;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif;padding:12px}
h1{font-size:1.4rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
label{font:13px system-ui,sans-serif;display:block}
input[type=file]{width:100%;font-size:12px}
button{font:600 14px system-ui,sans-serif;background:var(--ac);color:var(--bg);border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
canvas{width:100%;height:auto;display:block;background:#fff;border-radius:4px}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
select{width:100%;font:16px system-ui,sans-serif;padding:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px}
summary{cursor:pointer;font:14px system-ui,sans-serif;margin-bottom:8px}
#tick{opacity:0}#tick.on{opacity:1}#tick path{stroke-dasharray:1;stroke-dashoffset:1}#tick.on path{animation:draw .3s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){#tick.on path{animation:none;stroke-dashoffset:0}}
.big{font-size:2.2rem;font-weight:700;line-height:1.1}
.info{font:15px system-ui,sans-serif;display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}
.meter{position:relative;height:34px;border:1px solid var(--line);border-radius:4px;margin:8px 0;background:linear-gradient(90deg,transparent 42%,color-mix(in srgb,var(--ok) 30%,transparent) 42% 58%,transparent 58%)}
.meter i{position:absolute;top:0;bottom:0;width:4px;left:50%;background:var(--ink);transition:left .3s}
.meter b{position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--line)}
#msg{font:600 15px system-ui,sans-serif;min-height:1.5em}
</style></head><body>
<h1>Estudo de violino</h1>
<div class="card"><label>Escolha a música<select id="sel"><option value="">Carregando lista...</option></select></label></div>
<details class="card"><summary>Usar meus próprios arquivos</summary><div class="files">
<label>Partitura (PNG, uma ou mais páginas)<input id="fPng" type="file" accept="image/*" multiple></label>
<label>MusicXML (.mxl, .musicxml, .xml)<input id="fXml" type="file" accept=".mxl,.musicxml,.xml"></label>
<label>Calibração (calib.json)<input id="fCal" type="file" accept=".json"></label>
<label>Imagem do violino<input id="fVio" type="file" accept="image/*"></label>
</div></details>
<div class="card" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<button id="bGo">Começar</button><button id="bPrev" class="alt">Nota anterior</button><button id="bSkip" class="alt">Pular nota</button>
<label style="margin-left:auto">Tolerância: <span id="tolV">25</span> cents<input id="tol" type="range" min="10" max="50" value="25"></label>
<label>Lá =<input id="a4" type="number" value="440" min="415" max="466" style="width:64px"> Hz</label>
</div>
<div class="grid">
<div class="card"><canvas id="cScore" width="800" height="500"></canvas></div>
<div>
<div class="card">
<div style="display:flex;align-items:center;gap:14px"><div class="big" id="target">–</div><svg id="tick" viewBox="0 0 52 52" width="56" height="56" aria-hidden="true"><path d="M7 29 L20 42 L46 9" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg></div>
<div class="info"><span id="str">Corda: –</span><span id="fing">Dedo: –</span><span id="prog"></span></div>
<canvas id="cVio" width="600" height="300"></canvas>
</div>
<div class="card">
<div>Você toca: <b id="heard">–</b> <span id="cents"></span></div>
<div class="meter" aria-label="Afinação"><b></b><i id="needle"></i></div>
<div id="msg" role="status">Carregue os arquivos e clique em Começar.</div>
</div></div></div>
<script>
const $=id=>document.getElementById(id);
const OPEN={G:55,D:62,A:69,E:76},STR=['G','D','A','E'];
const NAMES=['Dó','Dó#','Ré','Ré#','Mi','Fá','Fá#','Sol','Sol#','Lá','Lá#','Si'];
const nm=m=>NAMES[m%12]+(Math.floor(m/12)-1);
const STEP={C:0,D:2,E:4,F:5,G:7,A:9,B:11},HEAD=5.9,ACC=11,STAFF=40;
let cal=null,vio=null,pages=[],ev=[],idx=0,hold=0,run=false,ctx,an,buf;

const url=f=>URL.createObjectURL(f);
const img=f=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=url(f)});
function shrink(im,maxW){
  const k=Math.min(1,maxW/im.naturalWidth),c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(im,0,0,c.width,c.height);
  c.k=k;return c;
}
const say=(t,c)=>{$('msg').textContent=t;$('msg').style.color=c||'inherit'};

/* ---------- calibração (mesma lógica do programa em Python) ---------- */
function noteXY(s,n){
  const o=cal.overrides&&cal.overrides[s]&&cal.overrides[s][n];if(o)return o;
  const st=cal.strings[s],R=cal.ref_semitone||12;
  const f=cal.model==='linear'?n/R:(1-2**(-n/12))/(1-2**(-R/12));
  return [st.nut[0]+(st.ref[0]-st.nut[0])*f,st.nut[1]+(st.ref[1]-st.nut[1])*f];
}
function endXY(s){
  const st=cal.strings[s];if(st.end)return st.end;
  const k=1/(1-2**(-(cal.ref_semitone||12)/12));
  return [st.nut[0]+(st.ref[0]-st.nut[0])*k,st.nut[1]+(st.ref[1]-st.nut[1])*k];
}
const FINGER=['solta','1','1','2','2','3','3','4'];
function fingerings(){
  let prev=null;
  for(const e of ev){
    let c=[];
    for(const lim of [7,12,24]){
      for(const s of STR){const n=e.midi-OPEN[s];if(n>=0&&n<=lim)c.push([s,n])}
      if(c.length)break;
    }
    const cost=([s,n])=>(prev?((n&&prev[1])?.5*Math.abs(n-prev[1]):0)+.3*Math.abs(STR.indexOf(s)-STR.indexOf(prev[0])):0)+.05*n;
    c.sort((a,b)=>cost(a)-cost(b));
    e.fg=c[0]||null;if(e.fg)prev=e.fg;
    e.finger=e.fg?(e.fg[1]<8?FINGER[e.fg[1]]:'4 (posição alta)'):'fora da extensão';
  }
}

/* ---------- MusicXML ---------- */
async function readXml(f){
  let txt;
  if(/\.mxl$/i.test(f.name)){
    const z=await JSZip.loadAsync(await f.arrayBuffer());
    const c=z.file('META-INF/container.xml');let name;
    if(c){const d=new DOMParser().parseFromString(await c.async('string'),'text/xml');name=d.querySelector('rootfile').getAttribute('full-path')}
    else name=Object.keys(z.files).find(n=>/\.(xml|musicxml)$/i.test(n)&&!n.startsWith('META-INF'));
    txt=await z.file(name).async('string');
  }else txt=await f.text();
  return new DOMParser().parseFromString(txt,'text/xml');
}
const num=(el,sel,d)=>{const x=el&&el.querySelector(sel);return x?parseFloat(x.textContent):d};

function buildEvents(doc){
  const pl=doc.querySelector('defaults > page-layout');
  if(!pl||!pl.querySelector('page-width'))throw Error('MusicXML sem layout de página. Exporte pelo MuseScore.');
  const PW=num(pl,'page-width'),PH=num(pl,'page-height');
  const mg=pl.querySelector('page-margins');
  const M={l:num(mg,'left-margin',0),r:num(mg,'right-margin',0),t:num(mg,'top-margin',0)};
  const part=doc.querySelector('part');
  let page=1,sl=0,sr=0,top=70,dist=85,cur=null,sysList=[],out=[];
  let div=1,beats=4,bt=4;
  [...part.querySelectorAll(':scope > measure')].forEach(m=>{
    const w=parseFloat(m.getAttribute('width')||0);
    const pr=m.querySelector(':scope > print');let np=false,ns=false;
    if(pr){
      np=pr.getAttribute('new-page')==='yes';ns=pr.getAttribute('new-system')==='yes';
      if(np)page=parseInt(pr.getAttribute('page-number')||page+1);
      sl=num(pr,'system-layout > system-margins > left-margin',sl);
      sr=num(pr,'system-layout > system-margins > right-margin',sr);
      top=num(pr,'system-layout > top-system-distance',top);
      dist=num(pr,'system-layout > system-distance',dist);
    }
    const brk=cur&&!np&&!ns&&cur.x+w>cur.avail+2;
    if(!cur||np||ns||brk){
      cur={page,left:M.l+sl,x:0,avail:PW-M.l-M.r-sl-sr,
        top:(!cur||np)?M.t+top:cur.top+STAFF+dist};
      sysList.push(cur);
    }
    const x0=cur.left+cur.x;cur.x+=w;
    const at=m.querySelector(':scope > attributes');
    if(at){div=num(at,'divisions',div);beats=num(at,'time > beats',beats);bt=num(at,'time > beat-type',bt)}
    let t=0,last=null;const evs=new Map();
    for(const el of m.children){
      if(el.tagName==='backup')t-=num(el,'duration',0);
      else if(el.tagName==='forward')t+=num(el,'duration',0);
      else if(el.tagName==='note'){
        const chord=!!el.querySelector(':scope > chord'),grace=!!el.querySelector(':scope > grace');
        const dur=num(el,'duration',0);
        const key=chord&&last!==null?last:(grace?t-.001*(evs.size+1):t);
        last=key;
        const p=el.querySelector(':scope > pitch');
        const tieStop=[...el.querySelectorAll(':scope > tie')].some(x=>x.getAttribute('type')==='stop');
        if(p&&!el.querySelector(':scope > rest')&&!tieStop){
          const midi=12*(num(p,'octave')+1)+STEP[p.querySelector('step').textContent]+Math.trunc(num(p,'alter',0));
          const e=evs.get(key)||{midis:[],xs:[],acc:false};evs.set(key,e);
          e.midis.push(midi);
          if(el.querySelector(':scope > accidental'))e.acc=true;
          if(el.hasAttribute('default-x'))e.xs.push(x0+parseFloat(el.getAttribute('default-x')));
        }
        if(!chord&&!grace)t+=dur;
      }
    }
    [...evs.keys()].sort((a,b)=>a-b).forEach(k=>{
      const e=evs.get(k);
      const x=e.xs.length?Math.min(...e.xs):x0+w*.5;
      out.push({midi:Math.min(...e.midis),page:cur.page,
        fx:(x+HEAD)/PW,half:HEAD/PW,acc:e.acc?ACC/PW:0,
        yt:cur.top/PH-15/PH,yb:(cur.top+STAFF+15)/PH,
        sys:sysList.length-1,xa:x+HEAD,accOn:e.acc});
    });
  });
  SYS=sysList;return out; /* repetições (|: :|) não são expandidas neste protótipo */
}

/* ---------- ajuste da barra às pautas da imagem (funciona com PNG recortado) ---------- */
let SYS=[];
function staves(cv){
  const w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data,rows=[];
  for(let y=0;y<h;y++){
    let best=0,run=0,st=0,bs=0;
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      if(d[i+3]>128&&(d[i]+d[i+1]+d[i+2])/3<150){if(!run)st=x;run++;if(run>best){best=run;bs=st}}else run=0;
    }
    if(best>.1*w)rows.push([y,bs]);
  }
  const ls=[];
  for(const [y,sx] of rows){const L=ls[ls.length-1];if(L&&y-L.y1<=1){L.y1=y;L.s=Math.min(L.s,sx)}else ls.push({y0:y,y1:y,s:sx})}
  const c=ls.map(l=>({y:(l.y0+l.y1)/2,s:l.s})),out=[];
  for(let i=0;i+4<c.length;){
    const dd=[1,2,3,4].map(j=>c[i+j].y-c[i+j-1].y),mn=Math.min(...dd),mx=Math.max(...dd);
    if(mn>1&&mx<=1.35*mn){out.push({top:c[i].y,h:c[i+4].y-c[i].y,left:Math.min(...c.slice(i,i+5).map(q=>q.s))});i+=5}
    else i++;
  }
  return out;
}
function fitLayout(){
  const flat=[];
  pages.forEach((pg,pi)=>staves(pg).forEach(st=>flat.push({...st,page:pi+1})));
  if(flat.length===SYS.length&&flat.length){
    ev.forEach(e=>{
      const st=flat[e.sys],k=st.h/STAFF;
      e.page=st.page;e.px=st.left+(e.xa-SYS[e.sys].left)*k;
      e.pw=Math.max(6,14*k);e.pl=(HEAD+(e.accOn?ACC:0))*k+3;
      e.y0=st.top-15*k;e.y1=st.top+st.h+15*k;
    });
    return true;
  }
  ev.forEach(e=>{ /* plano B: supõe página inteira */
    const pg=pages[Math.min(e.page,pages.length)-1],W=pg.width,H=pg.height;
    e.px=e.fx*W;e.pw=W*.012;e.pl=(e.half+e.acc)*W+3;e.y0=e.yt*H;e.y1=e.yb*H;
  });
  return false;
}

/* ---------- desenho ---------- */
function drawScore(){
  const c=$('cScore'),g=c.getContext('2d'),e=ev[idx];
  const pg=pages[e?Math.min(e.page,pages.length)-1:0];
  if(!pg){g.clearRect(0,0,c.width,c.height);return}
  if(c.width!==pg.width){c.width=pg.width;c.height=pg.height}
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.drawImage(pg,0,0);
  if(e){
    const cx=e.px-e.pl-e.pw/2;
    g.fillStyle='rgba(255,140,0,.45)';
    g.fillRect(cx-e.pw/2,e.y0,e.pw,e.y1-e.y0);
  }
}
function drawVio(){
  const c=$('cVio'),g=c.getContext('2d'),e=ev[idx];
  if(!vio||!cal){return}
  if(c.width!==vio.width){c.width=vio.width;c.height=vio.height}
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.drawImage(vio,0,0);
  if(!e||!e.fg)return;
  const [s,n]=e.fg,k=c.width/900,K=vio.k;
  if(n===0){
    const a=noteXY(s,0).map(v=>v*K),b=endXY(s).map(v=>v*K);
    g.lineCap='round';g.strokeStyle='rgba(255,0,0,.35)';g.lineWidth=14*k;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();
    g.strokeStyle='#f00';g.lineWidth=4*k;g.stroke();
  }else{
    const [x,y]=noteXY(s,n).map(v=>v*K);
    g.fillStyle='#e22';g.strokeStyle='#fff';g.lineWidth=3*k;
    g.beginPath();g.arc(x,y,14*Math.max(k,.6),0,7);g.fill();g.stroke();
  }
}
function show(){
  const e=ev[idx];if(!e)return;
  $('target').textContent=nm(e.midi);
  $('str').textContent='Corda: '+(e.fg?e.fg[0]+(e.fg[1]===0?' solta':''):'–');
  $('fing').textContent='Dedo: '+e.finger;
  $('prog').textContent=`Nota ${idx+1} de ${ev.length}`;
  drawScore();drawVio();
}

/* ---------- afinação (YIN) ---------- */
let lastRms=0;const YD=new Float32Array(2000),YC=new Float32Array(2000);
function yin(b,sr){
  const W=1024,tmax=Math.min(Math.floor(sr/180),b.length-W-1),tmin=Math.max(2,Math.floor(sr/2700));
  let rms=0;for(let i=0;i<W;i++)rms+=b[i]*b[i];
  lastRms=Math.sqrt(rms/W);if(lastRms<.01)return 0;
  const d=YD,c=YC;
  for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const x=b[i]-b[i+t];s+=x*x}d[t]=s}
  let acc=0;c[0]=1;for(let t=1;t<=tmax;t++){acc+=d[t];c[t]=d[t]*t/(acc||1)}
  for(let t=tmin;t<tmax;t++){
    if(c[t]<.15){
      while(t+1<tmax&&c[t+1]<c[t])t++;
      const a=c[t-1],b2=c[t],g=c[t+1],den=a-2*b2+g;
      return sr/(t+(den?(a-g)/(2*den):0));
    }
  }
  return 0;
}
async function mic(){
  if(ctx)return;
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new AudioContext();an=ctx.createAnalyser();an.fftSize=4096;
  ctx.createMediaStreamSource(st).connect(an);buf=new Float32Array(an.fftSize);
}
let lastT=0,nd=0,hist=[],sm=null,wait=false,dipped=false,peak=0,prevR=0;
let fitOk=true,lock=false,tmr;const PAUSE=700;
function cancelLock(){clearTimeout(tmr);lock=false;$('tick').classList.remove('on')}
function accept(){
  lock=true;hold=0;
  $('tick').classList.add('on');
  say('Afinado!','var(--ok)');
  tmr=setTimeout(()=>{
    $('tick').classList.remove('on');
    hist=[];sm=null;
    advance();peak=0;prevR=1e9;lock=false;
  },PAUSE);
}
function advance(){
  const old=ev[idx].midi;hold=0;
  if(idx<ev.length-1){idx++;wait=ev[idx].midi===old;dipped=false;peak=lastRms;show();return}
  say('Fim da peça. Parabéns!','var(--ok)');run=false;
}
function loop(ts){
  if(!run)return;
  requestAnimationFrame(loop);
  if(ts-lastT<50)return;
  lastT=ts||0;if(lock)return;
  an.getFloatTimeDomainData(buf);
  const f=yin(buf,ctx.sampleRate),e=ev[idx],A=+$('a4').value||440,tol=+$('tol').value,r=lastRms;
  if(wait&&!dipped){
    peak=Math.max(peak,r);
    if(!f||r<peak*.5||(r>prevR*1.6&&r>.02))dipped=true;
  }
  prevR=r;
  if(!f||!e){hist=[];sm=null;hold=0;$('heard').textContent='–';$('cents').textContent='';return}
  hist.push(69+12*Math.log2(f/A));if(hist.length>7)hist.shift();
  const med=[...hist].sort((x,y)=>x-y)[hist.length>>1];
  sm=(sm===null||Math.abs(med-sm)>.7)?med:sm+(med-sm)*.2;
  const near=Math.round(sm),cents=Math.round((sm-e.midi)*100);
  $('heard').textContent=nm(near);
  const cd=Math.round(cents/5)*5,cc=Math.max(-50,Math.min(50,cents));
  $('cents').textContent=(cd>0?'+':'')+cd+' cents';
  if(Math.abs(cc-nd)>2)nd+=(cc-nd)*.15;
  $('needle').style.left=(50+nd*.9)+'%';
  if(wait&&!dipped){hold=0;say('Mesma nota de novo: pare ou troque o arco e toque outra vez.');return}
  wait=false;
  if(near===e.midi&&Math.abs(cents)<=tol){
    say('Afinado!','var(--ok)');
    if(++hold>=4)accept();
  }else{
    hold=0;
    say(near===e.midi?(cents>0?'Alto demais: abaixe um pouco':'Baixo demais: suba um pouco'):'Nota diferente da pedida','var(--bad)');
  }
}

/* ---------- lista de peças (pecas.json) ---------- */
let lista=[];
fetch('pecas.json').then(r=>r.json()).then(j=>{
  lista=j;const s=$('sel');s.innerHTML='';
  s.add(new Option('Escolha uma música...',''));
  j.forEach((p,i)=>s.add(new Option(p.titulo,i)));
}).catch(()=>{$('sel').innerHTML='<option value="">Lista indisponível (use seus arquivos abaixo)</option>'});
async function getFile(base,name){
  const r=await fetch(base+name);
  if(!r.ok)throw Error('Arquivo não encontrado: '+base+name);
  return new File([await r.blob()],name.split('/').pop());
}
async function getSources(){
  const i=$('sel').value;
  if(i!==''){
    const p=lista[i],b=p.pasta.replace(/\/?$/,'/');
    say('Carregando a música...');
    return {png:await Promise.all(p.paginas.map(n=>getFile(b,n))),xml:await getFile(b,p.musicxml),
      cf:await getFile(b,p.calib||'calib.json'),vf:await getFile(b,p.violino)};
  }
  return {png:$('fPng').files,xml:$('fXml').files[0],cf:$('fCal').files[0],vf:$('fVio').files[0]};
}

/* ---------- eventos ---------- */
async function prepare(){
  const {png,xml,cf,vf}=await getSources();
  if(!png.length||!xml)throw Error('Escolha uma música na lista (ou envie seus próprios arquivos).');
  pages=await Promise.all([...png].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).map(async f=>shrink(await img(f),1100)));
  ev=buildEvents(await readXml(xml));
  if(!ev.length)throw Error('Nenhuma nota encontrada no MusicXML.');
  fitOk=fitLayout();
  if(cf){
    const c=JSON.parse(await cf.text());
    const ok=c&&c.strings&&STR.every(s=>c.strings[s]&&c.strings[s].nut&&c.strings[s].ref);
    if(!ok)throw Error('Este não é um arquivo de calibração (calib.json). Ele precisa ter as cordas G, D, A e E com "nut" e "ref". Você pode ter escolhido outro .json, como violin_app_config.json ou o da partitura. Escolha o arquivo gerado em "Ajustar arrastando" na aba Braço do violino.');
    cal=c;
  }
  if(vf)vio=shrink(await img(vf),900);
  fingerings();idx=0;wait=false;cancelLock();show();
}
$('bGo').onclick=async()=>{
  try{
    run=false;
    if(!window.isSecureContext||!navigator.mediaDevices)throw Error('Microfone indisponível: a página precisa abrir por https:// (ou localhost). Endereço atual: '+location.protocol);
    say('Pedindo acesso ao microfone...');
    await mic();
    if(ctx.state==='suspended')await ctx.resume();
    await prepare();
    run=true;hold=0;say(fitOk?'Toque a nota indicada.':'Toque a nota indicada. (Aviso: não localizei as pautas na imagem; a barra pode ficar fora do lugar.)');loop();
  }catch(e){
    const m={NotAllowedError:'Microfone bloqueado. Clique no cadeado ao lado do endereço e permita o microfone. Dentro do Wix (iframe) isso é bloqueado: abra o link direto.',NotFoundError:'Nenhum microfone encontrado.',NotReadableError:'Outro programa está usando o microfone.'}[e.name];
    say(m||e.message,'var(--bad)');
  }
};
$('bSkip').onclick=()=>{wait=false;cancelLock();if(idx<ev.length-1){idx++;show()}};
$('bPrev').onclick=()=>{wait=false;cancelLock();if(idx>0){idx--;show()}};
$('tol').oninput=e=>$('tolV').textContent=e.target.value;
</script>

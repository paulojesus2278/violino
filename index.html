<style>

</style></head><body>
<h1>Estudo de violino</h1>
<div class="card"><label>Escolha a música<select id="sel"><option value="">Carregando lista...</option></select></label></div>

</div>
<div class="grid">
<div class="card"><div id="sMsg" role="status" style="font:600 15px Poppins,system-ui,sans-serif;min-height:1.5em;margin-bottom:6px"></div><canvas id="cScore" width="800" height="500"></canvas>
<div class="navbtns"><button id="bPrev" class="alt">Nota anterior</button><button id="bSkip" class="alt">Pular nota</button></div></div>
<div>
<div class="card">
<div style="display:flex;align-items:center;gap:14px"><div class="big" id="target">–</div><svg id="tick" viewBox="0 0 52 52" width="56" height="56" aria-hidden="true"><path d="M7 29 L20 42 L46 9" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg></div>

<div id="msg" role="status">Escolha a música e clique em Começar.</div>
</div></div></div>
<script>
const $=id=>document.getElementById(id);
const OPEN={G:55,D:62,A:69,E:76},STR=['G','D','A','E'];
const NAMES=['Dó','Dó#','Ré','Ré#','Mi','Fá','Fá#','Sol','Sol#','Lá','Lá#','Si'];
const nm=m=>NAMES[m%12]+(Math.floor(m/12)-1);
const STEP={C:0,D:2,E:4,F:5,G:7,A:9,B:11},HEAD=5.9,ACC=11,STAFF=40;
let cal=null,vio=null,pages=[],ev=[],idx=0,hold=0,run=false,ctx,an,buf;

const url=f=>URL.createObjectURL(f);
const img=f=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=url(f)});
function shrink(im,maxW){
  const k=Math.min(1,maxW/im.naturalWidth),c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(im,0,0,c.width,c.height);
  c.k=k;return c;
}
/* página -> canvas já recortado (crop) e reduzido; guarda que parte da página ele cobre */
function pageCanvas(im,L,maxW=1600){
  const C=CFG.crop,nw=im.naturalWidth,nh=im.naturalHeight,ar=nw/nh;
  const full=Math.abs(ar/(L.PW/L.PH)-1)<.02;
  let R=[0,0,1,1],sr=[0,0,nw,nh],pageW=nw;
  if(full){
    if(C){R=C;sr=[C[0]*nw,C[1]*nh,(C[2]-C[0])*nw,(C[3]-C[1])*nh]}
  }else{
    if(!C)throw Error('A imagem da partitura não é uma página inteira. Coloque as páginas inteiras exportadas do MuseScore ou adicione o arquivo .partitura.json (que tem o "crop") à música no pecas.json.');
    R=C;pageW=nw/(C[2]-C[0]);
    if(Math.abs(ar/((C[2]-C[0])*L.PW/((C[3]-C[1])*L.PH))-1)>.04)
      scoreWarn.push('Uma das imagens não tem a proporção do recorte (crop) do .partitura.json. A barra pode ficar fora do lugar.');
  }
  const k=Math.min(1,maxW/sr[2]),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sr[2]*k));c.height=Math.max(1,Math.round(sr[3]*k));
  const g=c.getContext('2d');g.imageSmoothingQuality='high';
  g.drawImage(im,sr[0],sr[1],sr[2],sr[3],0,0,c.width,c.height);
  c.region=R;c.pageW=pageW;return c;
}
const scoreMsg=(t,c)=>{$('sMsg').textContent=t||'';$('sMsg').style.color=c||'inherit'};
const say=(t,c)=>{$('msg').textContent=t;$('msg').style.color=c||'inherit'};

/* ---------- calibração (mesma lógica do programa em Python) ---------- */
function noteXY(s,n){
  const o=cal.overrides&&cal.overrides[s]&&cal.overrides[s][n];if(o)return o;
  const st=cal.strings[s],R=cal.ref_semitone||12;
  const f=cal.model==='linear'?n/R:(1-2**(-n/12))/(1-2**(-R/12));
  return [st.nut[0]+(st.ref[0]-st.nut[0])*f,st.nut[1]+(st.ref[1]-st.nut[1])*f];
}
function endXY(s){
  const st=cal.strings[s];if(st.end)return st.end;
  const k=1/(1-2**(-(cal.ref_semitone||12)/12));
  return [st.nut[0]+(st.ref[0]-st.nut[0])*k,st.nut[1]+(st.ref[1]-st.nut[1])*k];
}
const FINGER=['solta','1','1','2','2','3','3','4'];
function fingerings(){
  let prev=null;
  for(const e of ev){
    let c=[];
    for(const lim of [7,12,24]){
      for(const s of STR){const n=e.midi-OPEN[s];if(n>=0&&n<=lim)c.push([s,n])}
      if(c.length)break;
    }
    const cost=([s,n])=>(prev?((n&&prev[1])?.5*Math.abs(n-prev[1]):0)+.3*Math.abs(STR.indexOf(s)-STR.indexOf(prev[0])):0)+.05*n;
    c.sort((a,b)=>cost(a)-cost(b));
    e.fg=c[0]||null;if(e.fg)prev=e.fg;
    e.finger=e.fg?(e.fg[1]<8?FINGER[e.fg[1]]:'4 (posição alta)'):'fora da extensão';
  }
}

/* ---------- MusicXML ---------- */
async function readXml(f){
  let txt;
  if(/\.mxl$/i.test(f.name)){
    const z=await JSZip.loadAsync(await f.arrayBuffer());
    const c=z.file('META-INF/container.xml');let name;
    if(c){const d=new DOMParser().parseFromString(await c.async('string'),'text/xml');name=d.querySelector('rootfile').getAttribute('full-path')}
    else name=Object.keys(z.files).find(n=>/\.(xml|musicxml)$/i.test(n)&&!n.startsWith('META-INF'));
    txt=await z.file(name).async('string');
  }else txt=await f.text();
  return new DOMParser().parseFromString(txt,'text/xml');
}
const num=(el,sel,d)=>{const x=el&&el.querySelector(sel);return x?parseFloat(x.textContent):d};

/* ---------- detecção das pautas na imagem ---------- */
function staves(cv){
  const w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data,rows=[];
  for(let y=0;y<h;y++){
    let best=0,run=0,st=0,bs=0;
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      if(d[i+3]/255*(1-(d[i]+d[i+1]+d[i+2])/765)>.12){if(!run)st=x;run++;if(run>best){best=run;bs=st}}else run=0;
    }
    if(best>.1*w)rows.push([y,bs,bs+best]);
  }
  const ls=[];
  for(const [y,sx,ex] of rows){const L=ls[ls.length-1];if(L&&y-L.y1<=1){L.y1=y;L.s=Math.min(L.s,sx);L.e=Math.max(L.e,ex)}else ls.push({y0:y,y1:y,s:sx,e:ex})}
  const c=ls.map(l=>({y:(l.y0+l.y1)/2,s:l.s,e:l.e})),out=[];
  for(let i=0;i+4<c.length;){
    const dd=[1,2,3,4].map(j=>c[i+j].y-c[i+j-1].y),mn=Math.min(...dd),mx=Math.max(...dd);
    if(mn>1&&mx<=1.5*mn){out.push({top:c[i].y,h:c[i+4].y-c[i].y,left:Math.min(...c.slice(i,i+5).map(q=>q.s)),right:Math.max(...c.slice(i,i+5).map(q=>q.e))});i+=5}
    else i++;
  }
  return out;
}
/* ==PARTITURA-INICIO== */
/* ---------- partitura: mesma lógica do programa em Python ----------
   MusicXML -> layout da página (décimos) -> posição de cada ataque -> barra.
   As pautas vistas nas imagens corrigem página e altura (refine_layout),
   o "crop" e os ajustes vêm do .partitura.json gerado pelo programa. */
const BAR_DEF={width:4,color:'#f40101',alpha:1,pad:15,anchor:'before',gap:2};
let CFG=null,SC=null,BP=null,scoreWarn=[],techWarn=[];
const DEBUG=new URLSearchParams(location.search).has('teste');

function pageMargin(M,page){
  const odd=((BigInt(page)%2n)+2n)%2n===1n;
  return M[odd?'odd':'even']||M.both||Object.values(M)[0]||{l:0,r:0,t:0,b:0};
}
function parseLayout(doc){
  const pl=doc.querySelector('defaults > page-layout');
  if(!pl||!pl.querySelector('page-width'))throw Error('O MusicXML não tem o layout da página. Exporte pelo MuseScore (Arquivo > Exportar > MusicXML).');
  const PW=num(pl,'page-width'),PH=num(pl,'page-height'),margins={};
  pl.querySelectorAll('page-margins').forEach(pm=>{
    margins[pm.getAttribute('type')||'both']={l:num(pm,'left-margin',0),r:num(pm,'right-margin',0),t:num(pm,'top-margin',0),b:num(pm,'bottom-margin',0)};
  });
  const part=doc.querySelector('part');
  if(!part)throw Error('MusicXML sem partes.');
  let page=1n,sl=0,sr=0,topDist=70,sysDist=null,cur=null;
  const systems=[],measures=[];
  [...part.querySelectorAll(':scope > measure')].forEach((m,mi)=>{
    if(!m.hasAttribute('width'))throw Error('O MusicXML não traz a largura dos compassos. Exporte pelo MuseScore.');
    const pr=m.querySelector(':scope > print');let np=false,ns=false;
    if(pr){
      np=pr.getAttribute('new-page')==='yes';ns=pr.getAttribute('new-system')==='yes';
      if(np){let p=null;try{p=BigInt(pr.getAttribute('page-number'))}catch(_){}page=p!==null?p:page+1n}
      const g=(s,d)=>num(pr,s,d);
      sl=g('system-layout > system-margins > left-margin',sl);
      sr=g('system-layout > system-margins > right-margin',sr);
      topDist=g('system-layout > top-system-distance',topDist);
      const sd=pr.querySelector('system-layout > system-distance');if(sd)sysDist=parseFloat(sd.textContent);
    }
    const w=parseFloat(m.getAttribute('width'));
    const auto=cur!==null&&!(np||ns)&&cur.x+w>cur.avail+2;
    if(cur===null||np||ns||auto){
      const mg=pageMargin(margins,page);
      const top=(cur===null||np)?mg.t+topDist:cur.top+STAFF+(sysDist!==null?sysDist:85);
      cur={page,left:mg.l+sl,top,x:0,avail:PW-mg.l-mg.r-sl-sr};
      systems.push(cur);
    }
    measures.push({idx:mi,sys:systems.length-1,x0:cur.left+cur.x,w});
    cur.x+=w;
  });
  return {PW,PH,systems,measures,margins,npages:new Set(systems.map(s=>String(s.page))).size};
}
function partEvents(part,L){
  const out=[];let div=1,beats=4,bt=4;
  [...part.querySelectorAll(':scope > measure')].forEach((m,mi)=>{
    const at=m.querySelector(':scope > attributes');
    if(at){
      if(at.querySelector(':scope > divisions'))div=num(at,'divisions',div);
      const ti=at.querySelector(':scope > time');
      if(ti){const b=parseInt(ti.querySelector('beats')?.textContent),c=parseInt(ti.querySelector('beat-type')?.textContent);if(b>0&&c>0){beats=b;bt=c}}
    }
    const mlen=div*4*beats/bt,lay=L.measures[mi];
    let cur=0,last=null,seq=0;const evs=new Map();
    for(const el of m.children){
      if(el.tagName==='backup')cur-=num(el,'duration',0);
      else if(el.tagName==='forward')cur+=num(el,'duration',0);
      else if(el.tagName==='note'){
        const chord=!!el.querySelector(':scope > chord'),grace=!!el.querySelector(':scope > grace');
        const dur=num(el,'duration',0);
        let t=cur,f=1,s=0,key;
        if(chord&&last!==null){key=last}
        else if(grace){seq++;f=0;s=seq;key=cur+'|0|'+seq}
        else key=cur+'|1|0';
        if(chord&&last!==null){[t,f,s]=last.split('|').map(Number)}
        last=key;
        const p=el.querySelector(':scope > pitch');
        const tieStop=[...el.querySelectorAll(':scope > tie')].some(x=>x.getAttribute('type')==='stop');
        if(p&&!el.querySelector(':scope > rest')&&!tieStop){
          const midi=12*(num(p,'octave')+1)+STEP[p.querySelector('step').textContent]+Math.trunc(num(p,'alter',0));
          let e=evs.get(key);if(!e){e={t,f,s,pitches:new Set(),xs:[],acc:false};evs.set(key,e)}
          e.pitches.add(midi);
          if(el.querySelector(':scope > accidental'))e.acc=true;
          if(el.hasAttribute('default-x'))e.xs.push(lay.x0+parseFloat(el.getAttribute('default-x')));
        }
        if(!chord&&!grace)cur+=dur;
      }
    }
    out.push([...evs.values()].sort((a,b)=>a.t-b.t||a.f-b.f||a.s-b.s).map(e=>({
      pitches:[...e.pitches].sort((a,b)=>a-b),
      x:e.xs.length?Math.min(...e.xs):lay.x0+lay.w*Math.min(1,e.t/Math.max(mlen,1e-6)),
      acc:e.acc})));
  });
  return out;
}
function measureFlow(part){
  const flow=[];let curEnd=null;
  for(const m of part.querySelectorAll(':scope > measure')){
    const f={fwd:false,bwd:false,times:2,endings:null};let stop=false;
    for(const b of m.querySelectorAll(':scope > barline')){
      const r=b.querySelector(':scope > repeat');
      if(r){
        const d=r.getAttribute('direction');
        if(d==='forward')f.fwd=true;
        else if(d==='backward'){f.bwd=true;const t=parseInt(r.getAttribute('times')||'2');if(t>0)f.times=t}
      }
      const e=b.querySelector(':scope > ending');
      if(e){
        if(e.getAttribute('type')==='start')curEnd=(e.getAttribute('number')||'').match(/\d+/g)?.map(Number)||[];
        else stop=true;
      }
    }
    f.endings=curEnd&&curEnd.length?[...curEnd]:null;
    if(stop)curEnd=null;
    flow.push(f);
  }
  return flow;
}
function playOrder(flow){
  const n=flow.length,order=[],counts={};let i=0,start=0,pass=1,jumped=false,guard=0;
  while(i<n&&guard<100000){
    guard++;const f=flow[i];
    if(f.fwd&&!jumped){start=i;pass=1}
    jumped=false;
    if(f.endings&&!f.endings.includes(pass)){i++;continue}
    order.push(i);
    if(f.bwd){
      const c=counts[i]||0;
      if(c<f.times-1){counts[i]=c+1;pass=c+2;i=start;jumped=true;continue}
      pass=1;
    }
    i++;
  }
  return order;
}
function buildScore(doc){
  const layout=parseLayout(doc),parts=[...doc.querySelectorAll('part')];
  const order=playOrder(measureFlow(parts[0]));
  let best=null;
  for(const part of parts){
    let per;try{per=partEvents(part,layout)}catch(_){continue}
    const seq=[];
    for(const mi of order)for(let ei=0;ei<per[mi].length;ei++)seq.push([mi,ei]);
    if(!best||seq.length>best.seq.length)best={per,seq};
  }
  if(!best)throw Error('Não consegui ler as notas do MusicXML.');
  const warnings=[];
  if([...doc.querySelectorAll('sound')].some(s=>['dacapo','dalsegno','tocoda','fine'].some(k=>s.getAttribute(k))))
    warnings.push('A partitura tem saltos (D.C./D.S./Coda), que ainda não são tratados.');
  return {layout,per:best.per,seq:best.seq,order,warnings};
}
/* usa as pautas vistas nas imagens para dizer em que página e a que altura está cada linha de música */
function refineLayout(built,tops){
  const L=built.layout,total=tops.reduce((a,t)=>a+t.length,0),nsys=L.systems.length;
  if(total!==nsys){
    techWarn.push(`Achei ${total} linhas de música nas imagens, mas o MusicXML tem ${nsys}. Linhas achadas por imagem: ${tops.map((t,i)=>'página '+(i+1)+': '+t.length).join(' | ')}. Usei só as posições do MusicXML.`);
    console.warn(techWarn[techWarn.length-1]);
    return false;
  }
  let k=0;
  tops.forEach((ys,pi)=>{
    const p=pi+1;
    for(const y of ys){
      const sy=L.systems[k],dxm=pageMargin(L.margins,p).l-pageMargin(L.margins,sy.page).l;
      if(Math.abs(dxm)>1e-6){ /* margens esquerdas diferentes entre páginas pares e ímpares */
        sy.left+=dxm;
        L.measures.forEach((m,mi)=>{if(m.sys===k){m.x0+=dxm;built.per[mi].forEach(e=>e.x+=dxm)}});
      }
      sy.page=p;sy.top=y*L.PH;k++;
    }
  });
  L.npages=tops.length;
  return true;
}
function normalizePages(L){
  const ds=[...new Set(L.systems.map(s=>BigInt(s.page)))].sort((a,b)=>a<b?-1:a>b?1:0);
  L.systems.forEach(s=>{s.page=ds.findIndex(d=>d===BigInt(s.page))+1});
  L.npages=ds.length;
}
function evInfo(mi,ei){
  const L=SC.layout,e=SC.per[mi][ei],ms=L.measures[mi],sy=L.systems[ms.sys],A=CFG.adjust;
  const sa=A.systems[String(ms.sys)]||{},pa=A.pages[String(sy.page)]||{};
  const fx=(e.x+HEAD)/L.PW+(sa.dx||0)+(pa.dx||0)+(A.notes[mi+':'+ei]||0);
  const top=sy.top/L.PH+(sa.dy||0)+(pa.dy||0),pad=(+CFG.bar.pad||15)/L.PH;
  return {page:sy.page,fx,half:HEAD/L.PW,acc:e.acc?ACC/L.PW:0,yt:top-pad,yb:top+STAFF/L.PH+pad};
}
async function loadCfg(pf){
  let c={};
  if(pf){
    c=JSON.parse(await pf.text());
    if(!c||typeof c!=='object'||!(c.crop||c.bar||c.adjust))throw Error('Este arquivo não parece ser o .partitura.json do programa (ele precisa ter "crop").');
  }
  const a=c.adjust||{};
  return {crop:Array.isArray(c.crop)&&c.crop.length===4?c.crop.map(Number):null,
    adjust:{pages:a.pages||{},systems:a.systems||{},notes:a.notes||{}},
    bar:{...BAR_DEF,...(c.bar||{})},place:c.place||null};
}
/* tamanho da barra em "décimos" do MusicXML (independe do tamanho do PNG).
   No seu programa: largura 4 px e distância 2 px, com 1 décimo = 1,54 px no vídeo -> 2,6 e 1,3 décimos. */
function barParams(){
  const b=CFG.bar;
  return {wT:b.wT??2.6,gT:b.gT??1.3,color:b.color,alpha:+b.alpha,anchor:b.anchor};
}
function barRect(e,pg){
  const R=pg.region,I=e.info,sx=pg.width/(R[2]-R[0]),sy=pg.height/(R[3]-R[1]),t=sx/SC.layout.PW;
  const x=(I.fx-R[0])*sx,yt=(I.yt-R[1])*sy,yb=(I.yb-R[1])*sy;
  const w=Math.max(2,Math.round(BP.wT*t));
  const cx=BP.anchor==='center'?x:x-(I.half+I.acc)*sx-BP.gT*t-w/2;
  return {x:cx-w/2,y:yt,w,h:Math.max(4,yb-yt)};
}
/* ==PARTITURA-FIM== */

/* ---------- desenho ---------- */
function drawScore(){
  const c=$('cScore'),g=c.getContext('2d'),e=ev[idx];
  const pg=pages[e?Math.min(e.page,pages.length)-1:0];
  if(!pg){g.clearRect(0,0,c.width,c.height);return}
  if(c.width!==pg.width||c.height!==pg.height){c.width=pg.width;c.height=pg.height}
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.drawImage(pg,0,0);
  if(e&&!e.hide){
    const r=barRect(e,pg);
    g.globalAlpha=BP.alpha;g.fillStyle=BP.color;g.fillRect(r.x,r.y,r.w,r.h);g.globalAlpha=1;
  }
}
function drawVio(){
  const c=$('cVio'),g=c.getContext('2d'),e=ev[idx];
  if(!vio||!cal){return}
  if(c.width!==vio.width){c.width=vio.width;c.height=vio.height}
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  g.drawImage(vio,0,0);
  if(!e||!e.fg)return;
  const [s,n]=e.fg,k=c.width/900,K=vio.k;
  if(n===0){
    const a=noteXY(s,0).map(v=>v*K),b=endXY(s).map(v=>v*K);
    g.lineCap='round';g.strokeStyle='rgba(255,0,0,.35)';g.lineWidth=14*k;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();
    g.strokeStyle='#f00';g.lineWidth=4*k;g.stroke();
  }else{
    const [x,y]=noteXY(s,n).map(v=>v*K);
    g.fillStyle='#e22';g.strokeStyle='#fff';g.lineWidth=3*k;
    g.beginPath();g.arc(x,y,14*Math.max(k,.6),0,7);g.fill();g.stroke();
  }
}
function show(){
  const e=ev[idx];if(!e)return;
  $('target').textContent=nm(e.midi);
  $('str').textContent='Corda: '+(e.fg?e.fg[0]+(e.fg[1]===0?' solta':''):'–');
  $('fing').textContent='Dedo: '+e.finger;
  $('prog').textContent=`Nota ${idx+1} de ${ev.length}`;
  setLights(null);drawScore();drawVio();
}

/* ---------- afinação (YIN) ---------- */
let lastRms=0;const YD=new Float32Array(2000),YC=new Float32Array(2000);
function yin(b,sr){
  const W=1024,tmax=Math.min(Math.floor(sr/180),b.length-W-1),tmin=Math.max(2,Math.floor(sr/2700));
  let rms=0;for(let i=0;i<W;i++)rms+=b[i]*b[i];
  lastRms=Math.sqrt(rms/W);if(lastRms<.01)return 0;
  const d=YD,c=YC;
  for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const x=b[i]-b[i+t];s+=x*x}d[t]=s}
  let acc=0;c[0]=1;for(let t=1;t<=tmax;t++){acc+=d[t];c[t]=d[t]*t/(acc||1)}
  for(let t=tmin;t<tmax;t++){
    if(c[t]<.15){
      while(t+1<tmax&&c[t+1]<c[t])t++;
      const a=c[t-1],b2=c[t],g=c[t+1],den=a-2*b2+g;
      return sr/(t+(den?(a-g)/(2*den):0));
    }
  }
  return 0;
}
async function mic(){
  if(ctx)return;
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new AudioContext();an=ctx.createAnalyser();an.fftSize=4096;
  ctx.createMediaStreamSource(st).connect(an);buf=new Float32Array(an.fftSize);
}
const LT=[...document.querySelectorAll('#lights i')];let lastHeard=0;
/* c = desvio em cents em relação à nota pedida (null = tudo apagado).
   verde: dentro da tolerância | laranja: até 2x a tolerância | vermelho: além disso */
function setLights(c){
  let on=-1;
  if(c!==null){const a=Math.abs(c),L=a<=TOL?0:a<=Math.min(2*TOL,50)?1:2;on=c<0?2-L:2+L}
  LT.forEach((el,i)=>el.classList.toggle('on',i===on));
}
let lastT=0,nd=0,hist=[],sm=null,wait=false,dipped=false,peak=0,prevR=0;
let fitOk=true,lock=false,tmr;const PAUSE=700;
function cancelLock(){clearTimeout(tmr);lock=false;$('tick').classList.remove('on')}
function accept(){
  lock=true;hold=0;
  $('tick').classList.add('on');
  say('Afinado!','var(--ok)');
  tmr=setTimeout(()=>{
    $('tick').classList.remove('on');
    hist=[];sm=null;
    advance();peak=0;prevR=1e9;lock=false;
  },PAUSE);
}
function advance(){
  const old=ev[idx].midi;hold=0;setLights(null);
  if(idx<ev.length-1){idx++;wait=ev[idx].midi===old;dipped=false;peak=lastRms;show();return}
  say('Fim da peça. Parabéns!','var(--ok)');run=false;letSleep();
}
function loop(ts){
  if(!run)return;
  requestAnimationFrame(loop);
  if(ts-lastT<50)return;
  lastT=ts||0;if(lock)return;
  an.getFloatTimeDomainData(buf);
  const f=yin(buf,ctx.sampleRate),e=ev[idx],A=+$('a4').value||440,tol=TOL,r=lastRms;
  if(wait&&!dipped){
    peak=Math.max(peak,r);
    if(!f||r<peak*.5||(r>prevR*1.6&&r>.02))dipped=true;
  }
  prevR=r;
  if(!f||!e){hist=[];sm=null;hold=0;$('heard').textContent='–';$('cents').textContent='';if(ts-lastHeard>250)setLights(null);return}
  hist.push(69+12*Math.log2(f/A));if(hist.length>7)hist.shift();
  const med=[...hist].sort((x,y)=>x-y)[hist.length>>1];
  sm=(sm===null||Math.abs(med-sm)>.7)?med:sm+(med-sm)*.2;
  const near=Math.round(sm),cents=Math.round((sm-e.midi)*100);
  $('heard').textContent=nm(near);
  const cd=Math.round(cents/5)*5,cc=Math.max(-50,Math.min(50,cents));
  $('cents').textContent=(cd>0?'+':'')+cd+' cents';
  lastHeard=ts;setLights(cents);
  if(wait&&!dipped){hold=0;say('Mesma nota de novo: pare ou troque o arco e toque outra vez.');return}
  wait=false;
  if(near===e.midi&&Math.abs(cents)<=tol){
    say('Afinado!','var(--ok)');
    if(++hold>=4)accept();
  }else{
    hold=0;
    say(near===e.midi?(cents>0?'Alto demais: abaixe um pouco':'Baixo demais: suba um pouco'):'Nota diferente da pedida','var(--bad)');
  }
}

/* ---------- lista de peças (pecas.json) ---------- */
let lista=[];
fetch('pecas.json').then(r=>r.json()).then(j=>{
  lista=j;const s=$('sel');s.innerHTML='';
  s.add(new Option('Escolha uma música...',''));
  j.forEach((p,i)=>s.add(new Option(p.titulo,i)));
}).catch(()=>{$('sel').innerHTML='<option value="">Lista de músicas indisponível</option>'});
async function getFile(base,name){
  const r=await fetch(base+name);
  if(!r.ok)throw Error('Arquivo não encontrado: '+base+name);
  return new File([await r.blob()],name.split('/').pop());
}
async function getSources(){
  const i=$('sel').value;
  if(i!==''){
    const p=lista[i],b=p.pasta.replace(/\/?$/,'/');
    scoreMsg('Carregando a partitura...');
    return {png:await Promise.all(p.paginas.map(n=>getFile(b,n))),xml:await getFile(b,p.musicxml),
      cf:await getFile(b,p.calib||'calib.json'),vf:await getFile(b,p.violino),
      pf:p.partitura?await getFile(b,p.partitura):null,barra:p.barra||{}};
  }
  throw Error('Escolha uma música na lista.');
}

/* ---------- eventos ---------- */
async function prepare(){
  const {png,xml,cf,vf,pf,barra}=await getSources();
  if(!png.length||!xml)throw Error('Escolha uma música na lista.');
  scoreWarn=[];techWarn=[];
  CFG=await loadCfg(pf);
  if(barra.cor)CFG.bar.color=barra.cor;
  if(barra.opacidade!=null)CFG.bar.alpha=barra.opacidade;
  if(barra.largura!=null)CFG.bar.wT=+barra.largura;      /* em décimos (padrão 2,6) */
  if(barra.distancia!=null)CFG.bar.gT=+barra.distancia;  /* em décimos (padrão 1,3) */
  SC=buildScore(await readXml(xml));
  scoreWarn.push(...SC.warnings);
  const L=SC.layout,files=[...png].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  pages=[];
  for(const f of files)pages.push(pageCanvas(await img(f),L));
  /* como no programa: as pautas vistas nas imagens dizem a página e a altura de cada linha de música */
  const tops=pages.map(pg=>staves(pg).map(s=>pg.region[1]+s.top/pg.height*(pg.region[3]-pg.region[1])));
  if(!refineLayout(SC,tops))normalizePages(L);
  if(pages.length<L.npages)scoreWarn.push(`A partitura tem ${L.npages} página(s), mas só ${pages.length} imagem(ns) foram colocadas. A barra some onde faltar página.`);
  BP=barParams();
  ev=SC.seq.map(([mi,ei])=>{
    const info=evInfo(mi,ei);
    return {midi:Math.min(...SC.per[mi][ei].pitches),mi,ei,info,page:info.page,hide:info.page>pages.length};
  });
  if(!ev.length)throw Error('Nenhuma nota encontrada no MusicXML.');
  if(DEBUG)scoreWarn.push(...techWarn);
  fitOk=!scoreWarn.length;
  if(cf){
    const c=JSON.parse(await cf.text());
    const ok=c&&c.strings&&STR.every(s=>c.strings[s]&&c.strings[s].nut&&c.strings[s].ref);
    if(!ok)throw Error('Este não é um arquivo de calibração (calib.json). Ele precisa ter as cordas G, D, A e E com "nut" e "ref". Você pode ter escolhido outro .json, como violin_app_config.json ou o da partitura. Escolha o arquivo gerado em "Ajustar arrastando" na aba Braço do violino.');
    cal=c;
  }
  if(vf)vio=shrink(await img(vf),900);
  fingerings();idx=0;wait=false;cancelLock();show();
}
/* mantém a tela acesa enquanto o aluno toca (Wake Lock; precisa de Chrome/Android ou Safari 16.4+) */
let wl=null;
async function keepAwake(){
  try{
    if(!('wakeLock' in navigator)||wl)return;
    wl=await navigator.wakeLock.request('screen');
    wl.addEventListener('release',()=>{wl=null});
  }catch(_){wl=null}
}
function letSleep(){try{if(wl)wl.release()}catch(_){}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&run)keepAwake()});

$('bGo').onclick=async()=>{
  let stage='mic';
  try{
    run=false;scoreMsg('');keepAwake();
    if(!window.isSecureContext||!navigator.mediaDevices)throw Error('Microfone indisponível: a página precisa abrir por https:// (ou localhost). Endereço atual: '+location.protocol);
    say('Pedindo acesso ao microfone...');
    await mic();
    if(ctx.state==='suspended')await ctx.resume();
    stage='load';say('');
    await prepare();
    scoreMsg(fitOk?'':'Aviso: '+scoreWarn.join(' '),fitOk?undefined:'var(--bad)');
    run=true;hold=0;say('Toque a nota indicada.');loop();
  }catch(e){
    letSleep();
    const m={NotAllowedError:'Microfone bloqueado. Clique no cadeado ao lado do endereço e permita o microfone. Dentro do Wix (iframe) isso é bloqueado: abra o link direto.',NotFoundError:'Nenhum microfone encontrado.',NotReadableError:'Outro programa está usando o microfone.'}[e.name];
    if(stage==='load'){scoreMsg(m||e.message,'var(--bad)');say('')}else say(m||e.message,'var(--bad)');
  }
};
$('bSkip').onclick=()=>{wait=false;cancelLock();if(idx<ev.length-1){idx++;show()}};
$('bPrev').onclick=()=>{wait=false;cancelLock();if(idx>0){idx--;show()}};
/* níveis: tolerância (cents) para o verde. Laranja vai até 2x isso (no máximo 50). Mude os números aqui se quiser. */
const NIVEIS=[30,20,12];let TOL=20;
function setLevel(i,save){
  TOL=NIVEIS[i];
  document.querySelectorAll('#levels .lv').forEach(b=>b.setAttribute('aria-checked',+b.dataset.lv===i?'true':'false'));
  if(save){try{localStorage.setItem('nivel',i)}catch(_){}}
  hold=0;setLights(null);
}
document.querySelectorAll('#levels .lv').forEach(b=>b.onclick=()=>setLevel(+b.dataset.lv,true));
let nivelSalvo=1;try{const v=+localStorage.getItem('nivel');if(v>=0&&v<=2&&localStorage.getItem('nivel')!==null)nivelSalvo=v}catch(_){}
setLevel(nivelSalvo,false);
</script>
